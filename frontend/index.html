<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FA 챗봇 - 단말기 SN 조회</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── 세션 만료 배너 ── */
    #session-banner {
      display: none;
      background: #b71c1c;
      color: #fff;
      padding: 10px 20px;
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.6;
    }
    #session-banner strong { font-size: 1rem; }
    #session-banner code {
      background: rgba(255,255,255,0.2);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    /* ── 헤더 ── */
    header {
      background: #1e3a5f;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header .badge {
      font-size: 0.7rem;
      background: #4caf50;
      border-radius: 10px;
      padding: 2px 8px;
    }
    #status-badge {
      margin-left: auto;
      font-size: 0.75rem;
      color: #a0c4e8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }

    /* ── 채팅 영역 ── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot {
      background: #fff;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .msg.user {
      background: #1e3a5f;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.progress {
      background: #e8f4fd;
      border: 1px solid #b3d9f5;
      color: #1a6fa8;
      align-self: flex-start;
      font-size: 0.82rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .msg.error {
      background: #fdecea;
      border: 1px solid #f5c6c0;
      color: #c0392b;
      align-self: flex-start;
    }
    .msg.result-card {
      background: #fff;
      border: 1px solid #c8e6c9;
      border-left: 4px solid #4caf50;
      max-width: 96%;
      padding: 14px 16px;
    }
    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #1e3a5f 0%, #2e6da4 100%);
      margin: -14px -16px 14px -16px;
      padding: 10px 16px;
      border-radius: 6px 6px 0 0;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
    }
    .result-header .sn-badge {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 1px 8px;
      font-size: 0.85rem;
      font-family: monospace;
      letter-spacing: 0.05em;
    }
    /* ── feature 테이블 ── */
    .feat-table-wrap {
      margin-bottom: 16px;
    }
    .feat-label {
      font-weight: 600;
      font-size: 0.82rem;
      color: #1e3a5f;
      background: #e8f0fb;
      display: inline-block;
      padding: 2px 10px;
      border-radius: 4px 4px 0 0;
      border: 1px solid #c5d5f0;
      border-bottom: none;
    }
    .feat-count { font-weight: 400; color: #555; }
    .tbl-scroll {
      overflow-x: auto;
      border: 1px solid #c5d5f0;
      border-radius: 0 4px 4px 4px;
    }
    .tbl-scroll table {
      border-collapse: collapse;
      font-size: 0.78rem;
      white-space: nowrap;
      min-width: 100%;
    }
    .tbl-scroll thead th {
      background: #1e3a5f;
      color: #fff;
      padding: 5px 10px;
      text-align: center;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    .tbl-scroll tbody tr:nth-child(even) { background: #f4f8ff; }
    .tbl-scroll tbody td {
      padding: 4px 10px;
      border-bottom: 1px solid #e0e8f5;
      text-align: center;
      color: #222;
    }
    .no-data { color: #999; font-size: 0.82rem; padding: 4px 0; }
    /* ── AI 분석 결과 ── */
    .ai-analysis {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #c8e6c9;
    }
    .ai-analysis-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #2e6da4;
      background: #e8f3fc;
      border: 1px solid #b3d4f0;
      border-radius: 12px;
      padding: 2px 10px;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }
    .ai-analysis-body h1,
    .ai-analysis-body h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1e3a5f;
      border-left: 3px solid #2e6da4;
      padding-left: 8px;
      margin: 14px 0 8px;
    }
    .ai-analysis-body h3,
    .ai-analysis-body h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #2e6da4;
      background: #f0f6ff;
      border-radius: 4px;
      padding: 3px 8px;
      margin: 12px 0 6px;
      display: block;
    }
    .ai-analysis-body {
      font-size: 0.88rem;
      color: #333;
      line-height: 1.6;
    }
    .ai-analysis-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
      font-size: 0.83rem;
    }
    .ai-analysis-body th,
    .ai-analysis-body td {
      border: 1px solid #d0d7de;
      padding: 5px 10px;
      text-align: center;
      white-space: nowrap;
    }
    .ai-analysis-body th {
      background: #f0f4f8;
      font-weight: 600;
    }
    .ai-analysis-body tr:nth-child(even) td {
      background: #f9fbfc;
    }
    .ai-analysis-body p { margin: 4px 0; }
    .ai-analysis-body pre {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.82rem;
    }

    /* 타이핑 애니메이션 */
    .typing-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #888;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── 입력 영역 ── */
    #input-area {
      padding: 16px 20px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #sn-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ccc;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #sn-input:focus { border-color: #1e3a5f; }
    #sn-input:disabled { background: #f5f5f5; }

    #send-btn {
      background: #1e3a5f;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 22px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: #2b527a; }
    #send-btn:disabled { background: #999; cursor: not-allowed; }

    #hint {
      font-size: 0.72rem;
      color: #888;
      text-align: center;
      padding: 4px 0 0;
    }
  </style>
</head>
<body>

<!-- 세션 만료 알림 배너 -->
<div id="session-banner">
  <strong>포털 세션이 만료되었습니다</strong><br>
  관리자가 서버에서 <code>python scripts/manual_login.py</code> 를 실행해 재로그인을 완료하면 자동으로 복구됩니다.
</div>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
  </svg>
  <h1>FA 챗봇 - 단말기 조회 서비스</h1>
  <span class="badge">내부용</span>
  <div id="status-badge">
    <div id="status-dot"></div>
    <span id="status-text">연결 중...</span>
  </div>
</header>

<div id="chat-area">
  <div class="msg bot">
    안녕하세요! FA 단말기 조회 챗봇입니다.<br><br>
    조회할 <strong>단말기 SN</strong>을 입력해 주세요.<br>
    <small style="color:#888">예: ABC-123456, SN20240101XYZ</small>
  </div>
</div>

<div id="input-area">
  <input
    id="sn-input"
    type="text"
    placeholder="단말기 SN 입력 (예: ABC-123456)"
    maxlength="50"
    autocomplete="off"
    autocapitalize="characters"
  />
  <button id="send-btn">조회</button>
</div>
<div id="hint">쿼리 실행은 5~15분 소요될 수 있습니다 · 최대 5건 동시 조회 가능</div>

<script>
  // ── WebSocket 연결 ──────────────────────────────────────────────────────────
  const WS_URL = `ws://${location.host}/ws/chat`;
  let ws = null;
  let reconnectTimer = null;
  let isQuerying = false;
  let progressMsgEl = null;

  const chatArea   = document.getElementById('chat-area');
  const snInput    = document.getElementById('sn-input');
  const sendBtn    = document.getElementById('send-btn');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      setStatus(true);
      clearTimeout(reconnectTimer);
    };

    ws.onclose = () => {
      setStatus(false);
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = () => setStatus(false);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleMessage(data);
    };
  }

  function setStatus(online) {
    statusDot.style.background = online ? '#4caf50' : '#e53935';
    statusText.textContent = online ? '연결됨' : '연결 끊김 (재연결 중...)';
  }

  // ── 메시지 처리 ───────────────────────────────────────────────────────────
  function handleMessage(data) {
    removeTyping();

    if (data.type === 'progress') {
      showProgress(data.message);
      return;
    }

    // 진행 메시지 제거
    if (progressMsgEl) {
      progressMsgEl.remove();
      progressMsgEl = null;
    }

    if (data.type === 'result') {
      appendResult(data);
    } else if (data.type === 'error') {
      if (data.session_expired) {
        showSessionExpiredBanner();
      }
      appendMsg('error', `오류: ${data.message}`);
    }

    setQuerying(false);
  }

  function showProgress(message) {
    if (!progressMsgEl) {
      progressMsgEl = document.createElement('div');
      progressMsgEl.className = 'msg progress';
      progressMsgEl.innerHTML = `
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="progress-text"></span>
      `;
      chatArea.appendChild(progressMsgEl);
    }
    progressMsgEl.querySelector('#progress-text').textContent = message;
    scrollBottom();
  }

  function appendResult(data) {
    const d = data.data || {};
    console.log('[AI message 원문]', data.message);
    const el = document.createElement('div');
    el.className = 'msg result-card';

    // 헤더
    let html = `<div class="result-header">&#128225; 조회 결과 &nbsp;<span class="sn-badge">${escapeHtml(d.sn || '')}</span></div>`;

    // feature 테이블 (서버에서 생성한 HTML 그대로 삽입)
    if (d.html_tables) {
      html += d.html_tables;
    }

    // AI 분석 결과
    if (data.message) {
      html += `
        <div class="ai-analysis">
          <div class="ai-analysis-body">${marked.parse(data.message)}</div>
        </div>`;
    }

    el.innerHTML = html;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendMsg(type, text) {
    const el = document.createElement('div');
    el.className = `msg ${type}`;
    el.textContent = text;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function showSessionExpiredBanner() {
    document.getElementById('session-banner').style.display = 'block';
    // 입력도 잠금
    snInput.disabled = true;
    sendBtn.disabled = true;
    sendBtn.textContent = '세션 만료';
  }

  function hideSessionExpiredBanner() {
    document.getElementById('session-banner').style.display = 'none';
    snInput.disabled = false;
    sendBtn.disabled = false;
    sendBtn.textContent = '조회';
  }

  // 주기적으로 세션 상태 체크 (60초마다)
  async function checkSessionStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      if (data.session && data.session.status === 'active') {
        hideSessionExpiredBanner();
      }
    } catch (e) { /* 무시 */ }
  }
  setInterval(checkSessionStatus, 60_000);

  function removeTyping() {
    // 별도 타이핑 인디케이터가 있다면 제거
  }

  function scrollBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── 전송 ─────────────────────────────────────────────────────────────────
  function sendQuery() {
    const sn = snInput.value.trim().toUpperCase();
    if (!sn) { snInput.focus(); return; }
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      appendMsg('error', '서버에 연결되지 않았습니다. 잠시 후 다시 시도해 주세요.');
      return;
    }

    appendMsg('user', isQuerying ? `SN: ${sn} (대기 중...)` : `SN: ${sn}`);
    snInput.value = '';
    setQuerying(true);
    showProgress('서버에 요청 전송 중...');

    ws.send(JSON.stringify({ sn }));
  }

  function setQuerying(state) {
    isQuerying = state;
    // 입력창/버튼은 항상 활성 상태 유지 (추가 SN 입력 허용)
    sendBtn.textContent = state ? '조회 중' : '조회';
  }

  sendBtn.addEventListener('click', sendQuery);
  snInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendQuery();
  });

  // ── 초기 연결 ─────────────────────────────────────────────────────────────
  connect();
</script>
</body>
</html>
