<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FA 챗봇 - 단말기 SN 조회</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── 헤더 ── */
    header {
      background: #1e3a5f;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header .badge {
      font-size: 0.7rem;
      background: #4caf50;
      border-radius: 10px;
      padding: 2px 8px;
    }
    #status-badge {
      margin-left: auto;
      font-size: 0.75rem;
      color: #a0c4e8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }

    /* ── 채팅 영역 ── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot {
      background: #fff;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .msg.user {
      background: #1e3a5f;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.progress {
      background: #e8f4fd;
      border: 1px solid #b3d9f5;
      color: #1a6fa8;
      align-self: flex-start;
      font-size: 0.82rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .msg.error {
      background: #fdecea;
      border: 1px solid #f5c6c0;
      color: #c0392b;
      align-self: flex-start;
    }
    .msg.result-card {
      background: #fff;
      border: 1px solid #c8e6c9;
      border-left: 4px solid #4caf50;
      max-width: 90%;
    }
    .result-header {
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chip {
      background: #e3f2fd;
      color: #1565c0;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .chip.active { background: #e8f5e9; color: #2e7d32; }
    .chip.inactive { background: #fce4ec; color: #b71c1c; }
    .result-body { font-size: 0.88rem; color: #333; white-space: pre-wrap; }

    /* 타이핑 애니메이션 */
    .typing-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #888;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── 입력 영역 ── */
    #input-area {
      padding: 16px 20px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #sn-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ccc;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #sn-input:focus { border-color: #1e3a5f; }
    #sn-input:disabled { background: #f5f5f5; }

    #send-btn {
      background: #1e3a5f;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 22px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: #2b527a; }
    #send-btn:disabled { background: #999; cursor: not-allowed; }

    #hint {
      font-size: 0.72rem;
      color: #888;
      text-align: center;
      padding: 4px 0 0;
    }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
  </svg>
  <h1>FA 챗봇 - 단말기 조회 서비스</h1>
  <span class="badge">내부용</span>
  <div id="status-badge">
    <div id="status-dot"></div>
    <span id="status-text">연결 중...</span>
  </div>
</header>

<div id="chat-area">
  <div class="msg bot">
    안녕하세요! FA 단말기 조회 챗봇입니다.<br><br>
    조회할 <strong>단말기 SN</strong>을 입력해 주세요.<br>
    <small style="color:#888">예: ABC-123456, SN20240101XYZ</small>
  </div>
</div>

<div id="input-area">
  <input
    id="sn-input"
    type="text"
    placeholder="단말기 SN 입력 (예: ABC-123456)"
    maxlength="50"
    autocomplete="off"
    autocapitalize="characters"
  />
  <button id="send-btn">조회</button>
</div>
<div id="hint">쿼리 실행은 5~15분 소요될 수 있습니다 · 최대 5건 동시 조회 가능</div>

<script>
  // ── WebSocket 연결 ──────────────────────────────────────────────────────────
  const WS_URL = `ws://${location.host}/ws/chat`;
  let ws = null;
  let reconnectTimer = null;
  let isQuerying = false;
  let progressMsgEl = null;

  const chatArea   = document.getElementById('chat-area');
  const snInput    = document.getElementById('sn-input');
  const sendBtn    = document.getElementById('send-btn');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      setStatus(true);
      clearTimeout(reconnectTimer);
    };

    ws.onclose = () => {
      setStatus(false);
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = () => setStatus(false);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleMessage(data);
    };
  }

  function setStatus(online) {
    statusDot.style.background = online ? '#4caf50' : '#e53935';
    statusText.textContent = online ? '연결됨' : '연결 끊김 (재연결 중...)';
  }

  // ── 메시지 처리 ───────────────────────────────────────────────────────────
  function handleMessage(data) {
    removeTyping();

    if (data.type === 'progress') {
      showProgress(data.message);
      return;
    }

    // 진행 메시지 제거
    if (progressMsgEl) {
      progressMsgEl.remove();
      progressMsgEl = null;
    }

    if (data.type === 'result') {
      appendResult(data);
    } else if (data.type === 'error') {
      appendMsg('error', `오류: ${data.message}`);
    }

    setQuerying(false);
  }

  function showProgress(message) {
    if (!progressMsgEl) {
      progressMsgEl = document.createElement('div');
      progressMsgEl.className = 'msg progress';
      progressMsgEl.innerHTML = `
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="progress-text"></span>
      `;
      chatArea.appendChild(progressMsgEl);
    }
    progressMsgEl.querySelector('#progress-text').textContent = message;
    scrollBottom();
  }

  function appendResult(data) {
    const d = data.data || {};
    const contractChip = d.contract_active
      ? '<span class="chip active">계약 활성</span>'
      : '<span class="chip inactive">계약 만료/없음</span>';

    const el = document.createElement('div');
    el.className = 'msg result-card';
    el.innerHTML = `
      <div class="result-header">단말기 조회 결과 — SN: ${escapeHtml(d.sn || '')}</div>
      <div class="result-meta">
        ${d.model ? `<span class="chip">모델: ${escapeHtml(d.model)}</span>` : ''}
        ${d.status ? `<span class="chip">상태: ${escapeHtml(d.status)}</span>` : ''}
        ${d.customer_name ? `<span class="chip">고객: ${escapeHtml(d.customer_name)}</span>` : ''}
        ${contractChip}
        ${d.service_history_count !== undefined ? `<span class="chip">서비스이력 ${d.service_history_count}건</span>` : ''}
      </div>
      <div class="result-body">${escapeHtml(data.message)}</div>
    `;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendMsg(type, text) {
    const el = document.createElement('div');
    el.className = `msg ${type}`;
    el.textContent = text;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function removeTyping() {
    // 별도 타이핑 인디케이터가 있다면 제거
  }

  function scrollBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── 전송 ─────────────────────────────────────────────────────────────────
  function sendQuery() {
    const sn = snInput.value.trim().toUpperCase();
    if (!sn) { snInput.focus(); return; }
    if (isQuerying) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      appendMsg('error', '서버에 연결되지 않았습니다. 잠시 후 다시 시도해 주세요.');
      return;
    }

    appendMsg('user', `SN: ${sn}`);
    snInput.value = '';
    setQuerying(true);
    showProgress('서버에 요청 전송 중...');

    ws.send(JSON.stringify({ sn }));
  }

  function setQuerying(state) {
    isQuerying = state;
    snInput.disabled = state;
    sendBtn.disabled = state;
    sendBtn.textContent = state ? '조회 중...' : '조회';
  }

  sendBtn.addEventListener('click', sendQuery);
  snInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendQuery();
  });

  // ── 초기 연결 ─────────────────────────────────────────────────────────────
  connect();
</script>
</body>
</html>
