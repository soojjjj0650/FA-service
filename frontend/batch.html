<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FA Service - Batch Query</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    .card h2 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8e8f0;
    }

    .sn-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sn-label {
      font-size: 0.82rem;
      color: #888;
      width: 36px;
      flex-shrink: 0;
      text-align: right;
    }

    .sn-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #dde1ea;
      border-radius: 8px;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: border-color 0.2s;
      outline: none;
    }
    .sn-input:focus {
      border-color: #4f73e3;
    }
    .sn-input::placeholder {
      text-transform: none;
      color: #bbb;
    }

    .sn-status {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #e8e8f0;
    }
    .sn-status.running  { background: #f0a500; animation: pulse 1s infinite; }
    .sn-status.success  { background: #28a745; }
    .sn-status.error    { background: #dc3545; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .btn-run {
      width: 100%;
      padding: 13px;
      background: #4f73e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-run:hover:not(:disabled) { background: #3a5ed0; }
    .btn-run:disabled {
      background: #a0b0d8;
      cursor: not-allowed;
    }

    .note {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }

    /* ── Progress ── */
    .progress-section {
      margin-top: 24px;
      display: none;
    }
    .progress-section.visible { display: block; }

    .progress-section h2 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8e8f0;
    }

    .progress-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f8f9ff;
      border: 1px solid #e8e8f0;
    }

    .pi-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .pi-dot.running  { background: #f0a500; animation: pulse 1s infinite; }
    .pi-dot.success  { background: #28a745; }
    .pi-dot.error    { background: #dc3545; }

    .pi-body { flex: 1; }
    .pi-sn   { font-weight: 600; font-size: 0.9rem; color: #222; }
    .pi-msg  { font-size: 0.82rem; color: #666; margin-top: 2px; word-break: break-all; }
    .pi-file { font-size: 0.78rem; color: #4f73e3; margin-top: 4px; word-break: break-all; }

    /* ── Final Status ── */
    .final-status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .final-status.completed {
      display: block;
      background: #e9f8ee;
      border: 1px solid #b2dfca;
      color: #1a6635;
    }
    .final-status.error {
      display: block;
      background: #fdecea;
      border: 1px solid #f5c6c6;
      color: #8b1a1a;
    }

    .session-banner {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      font-size: 0.84rem;
      color: #856404;
      display: none;
    }
    .session-banner.visible { display: block; }

    a.home-link {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #4f73e3;
      text-decoration: none;
    }
    a.home-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>FA Service - Batch Query</h1>
  <p class="subtitle">최대 5개 SN 동시 실행 &nbsp;|&nbsp; Superset SQL Lab 자동화</p>

  <div class="card">
    <h2>SN 입력 (최대 5개)</h2>
    <div class="sn-inputs" id="snInputs">
      <!-- JS로 생성 -->
    </div>
    <button class="btn-run" id="btnRun" onclick="startBatch()">쿼리 실행</button>
    <p class="note">빈 칸은 자동으로 무시됩니다. 각 SN의 CSV가 지정 폴더에 저장됩니다.</p>

    <div class="session-banner" id="sessionBanner">
      세션이 만료되었습니다. <strong>python scripts/manual_login.py</strong> 실행 후
      <a href="#" onclick="resetSession()">여기를 클릭해 세션을 복구하세요.</a>
    </div>

    <div class="progress-section" id="progressSection">
      <h2>진행 상태</h2>
      <div class="progress-rows" id="progressRows"></div>
      <div class="final-status" id="finalStatus"></div>
    </div>
  </div>

  <a class="home-link" href="/">← 챗봇으로 돌아가기</a>

  <script>
    const MAX_SN = 5;
    let pollTimer = null;
    let currentJobId = null;

    // ── SN 입력 필드 생성 ─────────────────────────────────────────────────────
    function buildInputs() {
      const container = document.getElementById('snInputs');
      for (let i = 0; i < MAX_SN; i++) {
        const row = document.createElement('div');
        row.className = 'sn-row';
        row.innerHTML = `
          <span class="sn-label">SN ${i + 1}</span>
          <input class="sn-input" id="sn${i}" type="text"
                 placeholder="시리얼 넘버 입력"
                 oninput="this.value=this.value.toUpperCase()"
                 ${i === 0 ? 'autofocus' : ''} />
          <span class="sn-status" id="dot${i}"></span>
        `;
        container.appendChild(row);
      }
    }

    // ── 쿼리 시작 ─────────────────────────────────────────────────────────────
    async function startBatch() {
      const sns = [];
      for (let i = 0; i < MAX_SN; i++) {
        const v = document.getElementById(`sn${i}`).value.trim();
        if (v) sns.push(v);
      }

      if (sns.length === 0) {
        alert('SN을 최소 1개 입력해 주세요.');
        return;
      }

      // UI 초기화
      resetProgress(sns);
      document.getElementById('btnRun').disabled = true;
      document.getElementById('sessionBanner').classList.remove('visible');
      document.getElementById('progressSection').classList.add('visible');
      document.getElementById('finalStatus').className = 'final-status';

      try {
        const res = await fetch('/api/batch-query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sns }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || '요청 실패');
          document.getElementById('btnRun').disabled = false;
          return;
        }

        currentJobId = data.job_id;
        pollStatus();

      } catch (e) {
        showError('서버 연결 오류: ' + e.message);
        document.getElementById('btnRun').disabled = false;
      }
    }

    // ── 상태 폴링 (2초 간격) ──────────────────────────────────────────────────
    function pollStatus() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(`/api/batch-status/${currentJobId}`);
          if (!res.ok) return;
          const job = await res.json();
          updateProgress(job);

          if (job.status === 'completed' || job.status === 'error') {
            clearInterval(pollTimer);
            document.getElementById('btnRun').disabled = false;
            showFinal(job);
          }
        } catch (e) {
          console.error('폴링 오류:', e);
        }
      }, 2000);
    }

    // ── 진행 UI 초기화 ─────────────────────────────────────────────────────────
    function resetProgress(sns) {
      const rows = document.getElementById('progressRows');
      rows.innerHTML = '';
      sns.forEach(sn => {
        const item = document.createElement('div');
        item.className = 'progress-item';
        item.id = `pi_${sn}`;
        item.innerHTML = `
          <div class="pi-dot running" id="pidot_${sn}"></div>
          <div class="pi-body">
            <div class="pi-sn">${escHtml(sn)}</div>
            <div class="pi-msg" id="pimsg_${sn}">대기 중...</div>
            <div class="pi-file" id="pifile_${sn}"></div>
          </div>
        `;
        rows.appendChild(item);
      });

      // 입력 안 한 SN 상태 초기화
      for (let i = 0; i < MAX_SN; i++) {
        document.getElementById(`dot${i}`).className = 'sn-status';
      }
    }

    // ── 진행 상태 업데이트 ────────────────────────────────────────────────────
    function updateProgress(job) {
      if (!job.progress) return;
      Object.entries(job.progress).forEach(([sn, msg]) => {
        const el = document.getElementById(`pimsg_${sn}`);
        if (el) el.textContent = msg;
      });

      if (job.results) {
        job.results.forEach(r => {
          const dot = document.getElementById(`pidot_${r.sn}`);
          const file = document.getElementById(`pifile_${r.sn}`);
          const msg  = document.getElementById(`pimsg_${r.sn}`);
          if (!dot) return;
          if (r.success) {
            dot.className = 'pi-dot success';
            if (file && r.csv_path) file.textContent = '저장: ' + r.csv_path;
            if (msg) msg.textContent = '완료';
          } else {
            dot.className = 'pi-dot error';
            if (msg) msg.textContent = r.error || '실패';
            if (r.session_expired) {
              document.getElementById('sessionBanner').classList.add('visible');
            }
          }
        });
      }
    }

    // ── 최종 결과 표시 ────────────────────────────────────────────────────────
    function showFinal(job) {
      const el = document.getElementById('finalStatus');
      if (job.status === 'completed') {
        const ok  = job.results.filter(r => r.success).length;
        const err = job.results.filter(r => !r.success).length;
        el.className = 'final-status completed';
        el.textContent = `완료: 성공 ${ok}건 / 실패 ${err}건. CSV 파일을 확인하세요.`;
      } else {
        el.className = 'final-status error';
        el.textContent = '배치 처리 오류: ' + (job.error || '알 수 없는 오류');
      }
    }

    function showError(msg) {
      const el = document.getElementById('finalStatus');
      el.className = 'final-status error';
      el.textContent = msg;
    }

    // ── 세션 복구 ─────────────────────────────────────────────────────────────
    async function resetSession() {
      await fetch('/api/session/reset', { method: 'POST' });
      document.getElementById('sessionBanner').classList.remove('visible');
      alert('세션 복구 완료. 다시 실행해 주세요.');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── 초기화 ────────────────────────────────────────────────────────────────
    buildInputs();
  </script>
</body>
</html>
