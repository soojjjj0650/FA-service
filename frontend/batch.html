<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FA Service - Batch Query</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    .card h2 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8e8f0;
    }

    .sn-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sn-label {
      font-size: 0.82rem;
      color: #888;
      width: 36px;
      flex-shrink: 0;
      text-align: right;
    }

    .sn-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #dde1ea;
      border-radius: 8px;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: border-color 0.2s;
      outline: none;
    }
    .sn-input:focus {
      border-color: #4f73e3;
    }
    .sn-input::placeholder {
      text-transform: none;
      color: #bbb;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .btn-run {
      width: 100%;
      padding: 13px;
      background: #4f73e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-run:hover:not(:disabled) { background: #3a5ed0; }
    .btn-run:disabled {
      background: #a0b0d8;
      cursor: not-allowed;
    }

    .note {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }

    /* ── Progress ── */
    .progress-section {
      margin-top: 24px;
      display: none;
    }
    .progress-section.visible { display: block; }

    .progress-section h2 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e8e8f0;
    }

    .progress-rows {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Job Block ── */
    .job-block {
      border: 1px solid #dde1ea;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fafbff;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }
    .job-time  { color: #aaa; }
    .job-sns   { color: #4f73e3; font-weight: 600; font-size: 0.82rem; }

    .progress-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f8f9ff;
      border: 1px solid #e8e8f0;
    }

    .pi-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .pi-dot.running  { background: #f0a500; animation: pulse 1s infinite; }
    .pi-dot.success  { background: #28a745; }
    .pi-dot.error    { background: #dc3545; }

    .pi-body { flex: 1; }
    .pi-sn   { font-weight: 600; font-size: 0.9rem; color: #222; }
    .pi-msg  { font-size: 0.82rem; color: #666; margin-top: 2px; word-break: break-all; }
    .pi-file { font-size: 0.78rem; color: #4f73e3; margin-top: 4px; word-break: break-all; }

    /* ── Final Status ── */
    .final-status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .final-status.completed {
      display: block;
      background: #e9f8ee;
      border: 1px solid #b2dfca;
      color: #1a6635;
    }
    .final-status.error {
      display: block;
      background: #fdecea;
      border: 1px solid #f5c6c6;
      color: #8b1a1a;
    }

    .session-banner {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      font-size: 0.84rem;
      color: #856404;
      display: none;
    }
    .session-banner.visible { display: block; }

    a.home-link {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #4f73e3;
      text-decoration: none;
    }
    a.home-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>FA Service - Batch Query</h1>
  <p class="subtitle">최대 5개 SN 동시 실행 &nbsp;|&nbsp; Superset SQL Lab 자동화</p>

  <div class="card">
    <h2>SN 입력 (최대 5개)</h2>
    <div class="sn-inputs" id="snInputs">
      <!-- JS로 생성 -->
    </div>
    <button class="btn-run" id="btnRun" onclick="startBatch()">쿼리 실행</button>
    <p class="note">빈 칸은 자동으로 무시됩니다. 각 SN의 CSV가 지정 폴더에 저장됩니다.</p>

    <div class="session-banner" id="sessionBanner">
      세션이 만료되었습니다. <strong>python scripts/manual_login.py</strong> 실행 후
      <a href="#" onclick="resetSession()">여기를 클릭해 세션을 복구하세요.</a>
    </div>

    <div class="progress-section" id="progressSection">
      <h2>진행 상태</h2>
      <div class="progress-rows" id="progressRows"></div>
    </div>
  </div>

  <a class="home-link" href="/">← 챗봇으로 돌아가기</a>

  <script>
    const MAX_SN = 5;
    // jobId → intervalId (여러 job 동시 폴링)
    const activePolls = {};

    // ── SN 입력 필드 생성 ─────────────────────────────────────────────────────
    function buildInputs() {
      const container = document.getElementById('snInputs');
      for (let i = 0; i < MAX_SN; i++) {
        const row = document.createElement('div');
        row.className = 'sn-row';
        row.innerHTML = `
          <span class="sn-label">SN ${i + 1}</span>
          <input class="sn-input" id="sn${i}" type="text"
                 placeholder="시리얼 넘버 입력"
                 oninput="this.value=this.value.toUpperCase()"
                 ${i === 0 ? 'autofocus' : ''} />
        `;
        container.appendChild(row);
      }
    }

    // ── 쿼리 시작 ─────────────────────────────────────────────────────────────
    async function startBatch() {
      const sns = [];
      for (let i = 0; i < MAX_SN; i++) {
        const v = document.getElementById(`sn${i}`).value.trim();
        if (v) sns.push(v);
      }

      if (sns.length === 0) {
        alert('SN을 최소 1개 입력해 주세요.');
        return;
      }

      const btn = document.getElementById('btnRun');
      btn.disabled = true;

      try {
        const res = await fetch('/api/batch-query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sns }),
        });
        const data = await res.json();

        if (!res.ok) {
          alert('오류: ' + (data.detail || '요청 실패'));
          return;
        }

        // 입력창 비우기 + 진행 블록 추가
        for (let i = 0; i < MAX_SN; i++) {
          document.getElementById(`sn${i}`).value = '';
        }
        addJobBlock(data.job_id, sns);
        startPolling(data.job_id);
        document.getElementById('sn0').focus();

      } catch (e) {
        alert('서버 연결 오류: ' + e.message);
      } finally {
        // 성공/실패 무관하게 버튼 항상 재활성화
        btn.disabled = false;
      }
    }

    // ── Job 진행 블록 추가 ─────────────────────────────────────────────────────
    function addJobBlock(jobId, sns) {
      const section = document.getElementById('progressSection');
      section.classList.add('visible');

      const block = document.createElement('div');
      block.className = 'job-block';
      block.id = `job_${jobId}`;

      const time = new Date().toLocaleTimeString('ko-KR');
      block.innerHTML = `
        <div class="job-header">
          <span class="job-time">${time} 실행</span>
          <span class="job-sns">${sns.map(escHtml).join(', ')}</span>
        </div>
        <div class="progress-rows" id="rows_${jobId}"></div>
        <div class="final-status" id="final_${jobId}"></div>
      `;

      // 최신 job을 맨 위에 추가
      const rows = document.getElementById('progressRows');
      rows.insertBefore(block, rows.firstChild);

      // 각 SN 행 추가
      const rowsEl = document.getElementById(`rows_${jobId}`);
      sns.forEach(sn => {
        const item = document.createElement('div');
        item.className = 'progress-item';
        item.innerHTML = `
          <div class="pi-dot running" id="pidot_${jobId}_${sn}"></div>
          <div class="pi-body">
            <div class="pi-sn">${escHtml(sn)}</div>
            <div class="pi-msg" id="pimsg_${jobId}_${sn}">대기 중...</div>
            <div class="pi-file" id="pifile_${jobId}_${sn}"></div>
          </div>
        `;
        rowsEl.appendChild(item);
      });
    }

    // ── 상태 폴링 ──────────────────────────────────────────────────────────────
    function startPolling(jobId) {
      const timer = setInterval(async () => {
        try {
          const res = await fetch(`/api/batch-status/${jobId}`);
          if (!res.ok) {
            // 서버 재시작 등으로 job이 사라진 경우
            clearInterval(activePolls[jobId]);
            delete activePolls[jobId];
            const final = document.getElementById(`final_${jobId}`);
            if (final) {
              final.className = 'final-status error';
              final.textContent = '서버에서 Job 정보를 찾을 수 없습니다. (서버 재시작 여부 확인)';
            }
            return;
          }
          const job = await res.json();
          updateJobProgress(jobId, job);

          if (job.status === 'completed' || job.status === 'error') {
            clearInterval(activePolls[jobId]);
            delete activePolls[jobId];
            showJobFinal(jobId, job);
          }
        } catch (e) {
          console.error('폴링 오류:', e);
        }
      }, 2000);
      activePolls[jobId] = timer;
    }

    // ── 진행 상태 업데이트 ────────────────────────────────────────────────────
    function updateJobProgress(jobId, job) {
      if (job.progress) {
        Object.entries(job.progress).forEach(([sn, msg]) => {
          const el = document.getElementById(`pimsg_${jobId}_${sn}`);
          if (el) el.textContent = msg;
        });
      }

      if (job.results) {
        job.results.forEach(r => {
          const dot  = document.getElementById(`pidot_${jobId}_${r.sn}`);
          const file = document.getElementById(`pifile_${jobId}_${r.sn}`);
          const msg  = document.getElementById(`pimsg_${jobId}_${r.sn}`);
          if (!dot) return;
          if (r.success) {
            dot.className = 'pi-dot success';
            if (msg) msg.textContent = '완료';
            if (file && r.csv_path) file.textContent = '저장: ' + r.csv_path;
          } else {
            dot.className = 'pi-dot error';
            if (msg) msg.textContent = r.error || '실패';
            if (r.session_expired) {
              document.getElementById('sessionBanner').classList.add('visible');
            }
          }
        });
      }
    }

    // ── 최종 결과 표시 ────────────────────────────────────────────────────────
    function showJobFinal(jobId, job) {
      const el = document.getElementById(`final_${jobId}`);
      if (!el) return;
      if (job.status === 'completed') {
        const ok  = job.results.filter(r => r.success).length;
        const err = job.results.filter(r => !r.success).length;
        el.className = 'final-status completed';
        el.textContent = `완료: 성공 ${ok}건 / 실패 ${err}건`;
      } else {
        el.className = 'final-status error';
        el.textContent = '배치 오류: ' + (job.error || '알 수 없는 오류');
      }
    }

    // ── 세션 복구 ─────────────────────────────────────────────────────────────
    async function resetSession() {
      await fetch('/api/session/reset', { method: 'POST' });
      document.getElementById('sessionBanner').classList.remove('visible');
      alert('세션 복구 완료. 다시 실행해 주세요.');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── 초기화 ────────────────────────────────────────────────────────────────
    buildInputs();
  </script>
</body>
</html>
